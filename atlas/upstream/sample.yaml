# SPDX-License-Identifier: Apache-2.0
# One scenario per Atlas-team host test and board variant (generated by hand from tests.cmake).
# Build-only: plain Spike has no Atlas (see atlas/kernels/sample.yaml). With the Atlas Spike model
# (SPIKE_EXTRA_ARGS, see the README) they can be run; the model has no tensor/DMA ops yet.
# run_tests.py builds only the board it is given, so the vcu118_ta scenarios SKIP on the default
# board: build them with --board chipyard_penguin/penguin/vcu118_ta.
# The tests marked `skip: true` need golden headers from the team's bit-exact models, whose Python
# generators `import torch`; no pre-generated headers exist in the source repo and our env has no
# torch. Remove `skip: true` (or build one with -DATLAS_TEST=<name>) in an environment with torch+numpy.
sample:
  name: atlas_upstream
common:
  tags: atlas hardware atlas_upstream
  build_only: true
tests:
  sample.penguin.atlas_upstream.atlas_alu_basic:
    platform_allow: chipyard_penguin/penguin
    extra_args: ATLAS_TEST=atlas_alu_basic
  sample.penguin.vcu118_ta.atlas_upstream.atlas_alu_basic:
    platform_allow: chipyard_penguin/penguin/vcu118_ta
    extra_args: ATLAS_TEST=atlas_alu_basic
