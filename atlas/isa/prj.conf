CONFIG_PRINTK=y
# Upstream tests use printf(); picolibc's stdout goes to the console.
CONFIG_STDOUT_CONSOLE=y
# Faults on the first Atlas access (no hardware there, e.g. on Spike) should
# print the trap cause rather than silently resetting.
CONFIG_EXCEPTION_DEBUG=y
# Upstream builds with -O2; Zephyr defaults to -Os. Keep the same flags as atlas/upstream. (IMEM race tests there
# depend on how fast the host code runs.)
CONFIG_SPEED_OPTIMIZATIONS=y
# The team harness keeps only small arrays on the stack; its big golden arrays are static const.
CONFIG_MAIN_STACK_SIZE=8192
