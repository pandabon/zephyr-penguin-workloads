# SPDX-License-Identifier: Apache-2.0
# Kconfig for the ExecuTorch runner. Derived from samples/exeggutorch/executor_runner/prj.conf of
# pandabon/zephyr-chipyard-sw (branch exeggutorch @ e12bfa38034, Jonathan Lin), with the sizes
# the 2026-10-09 bench build used (1 MiB heap, 1 MiB malloc arena).

# One hart; the SMP scheduler options are what ExecuTorch's threadpool build needs.
CONFIG_THREAD_STACK_INFO=y
CONFIG_MP_MAX_NUM_CPUS=1
CONFIG_SMP=y
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_THREAD_STACK_MEM_MAPPED=y
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_STACK_SIZE=16384
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_SCHED_CPU_MASK=y
CONFIG_SCHED_CPU_MASK_PIN_ONLY=y
CONFIG_SCHED_DUMB=y

CONFIG_POSIX_API=y
CONFIG_MULTITHREADING=y
CONFIG_POSIX_THREADS=y

CONFIG_FPU=y
CONFIG_RISCV_ISA_EXT_V=y

# Memory: the image is ~12 MB of XNNPACK kernels + these two arenas (zero-filled .bss/noinit).
# Shrinking them shortens the UART load (see the ExecuTorch section of the repo README: load time = memsz).
CONFIG_HEAP_MEM_POOL_SIZE=1048576
CONFIG_COMMON_LIBC_MALLOC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=1048576

CONFIG_CPP=y
CONFIG_STD_C17=y
CONFIG_STD_CPP20=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_PICOLIBC=y
