# Extra Kconfig for STEP MODE (the whole SmolVLA action step: a ~200 MB .pte, see CMakeLists.txt EXEC_STEP_DATA).
# Use as an overlay: -DEXTRA_CONF_FILE=<this file> (scripts/build.sh: EXTRA_CMAKE).
# Needs a board with a lot of RAM (chipyard_penguin/penguin/sophialake_4g: 4 GiB, hypothetical) and -DPENGUIN_ATLAS_GUARD=OFF
# because the image passes 0x9000_0000.
#
# malloc arena: XNNPACK packs the bf16/f32 weights of all 16 layers at load time (a second copy of ~200 MB) and
# allocates workspaces; 768 MiB is generous. It is a static array (zero-initialised .bss/.noinit): it costs RAM
# address space, not image bytes.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=805306368
