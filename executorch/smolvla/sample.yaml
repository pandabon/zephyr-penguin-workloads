# SPDX-License-Identifier: Apache-2.0
# ExecuTorch workloads are OPT-IN: they need EXECUTORCH_DIR (and usually XNNPACK_DIR) set, plus
# flatc/python on PATH, or CMake stops at configure. Twister has no "skip unless env var" key,
# so the tests carry the tag `executorch`: leave them out of a normal run with
#   twister -e executorch ...
# and select them with `--tag executorch` after exporting the variables (see the ExecuTorch section of the repo README.md).
# For the BSP's run_tests.py (--root), each test also carries `skip: true` so a normal suite run reports
# them as SKIP instead of failing at configure; build them directly (README) once the variables are set.
# They are build-only; the Spike run is `west build -t run` (expected output in the repo README.md).
sample:
  name: penguin_executorch_smolvla
  description: ExecuTorch runner with embedded inputs/expected output (SmolVLA expert layer), new forks
common:
  build_only: true
  tags: executorch workload rvv
  platform_allow:
    - chipyard_penguin/penguin
    - chipyard_penguin/penguin/vcu118_ta
  harness: console
  harness_config:
    type: multi_line
    regex:
      - "Model executed successfully"
      - "Output\\[0\\]\\[0\\]:"
tests:
  workload.executorch.smolvla.model:
    # EXEC_MODEL must be a path to a .pte (no models ship in this repo)
    extra_args: EXEC_MODEL=/path/to/model.pte
    skip: true
