# SPDX-License-Identifier: Apache-2.0
# One scenario per Saturn benchmark; every scenario builds saturn/ with -DSATURN_BENCH=<bench>.
# Both Penguin boards are allowed: the same ELF source runs on Spike for either (same ISA, only
# console and clock differ). Tags:
#   saturn            all of these
#   bench             in the recommended FPGA-bench subset (fast to load, self-checking)
#   smoke             the program does not check its own result: PASS only means "ran to the end"
#   (no smoke tag)    the program checks its own result: main() returns non-zero or exits 1 on a mismatch
#   fp8 / bf16        needs FP8 / bf16 vector instructions Spike does not implement (build_only)
# build_only scenarios are compiled but not run: Spike traps on the instruction ("Illegal
# instruction"); run them on the FPGA / chip.
# Known failures (run, but expected to fail) are listed in ../../known_failures.yaml (none at present).
common:
  platform_allow: chipyard_penguin/penguin chipyard_penguin/penguin/vcu118_ta
  arch_allow: riscv
  tags: saturn rvv
tests:
  saturn.fp16_convert_test:
    # SMOKE: this program prints numbers but does not compare them with a reference.
    tags: smoke
    extra_args: SATURN_BENCH=fp16_convert_test
  saturn.fp8FMA_test:
    # BUILD ONLY: FP8 arithmetic / conversion instructions are not implemented by Spike (Illegal instruction); needs the FPGA or chip.
    build_only: true
    # SMOKE: this program prints numbers but does not compare them with a reference.
    tags: smoke fp8
    extra_args: SATURN_BENCH=fp8FMA_test
  saturn.fp8_convert2_test:
    # BUILD ONLY: FP8 arithmetic / conversion instructions are not implemented by Spike (Illegal instruction); needs the FPGA or chip.
    build_only: true
    # SMOKE: this program prints numbers but does not compare them with a reference.
