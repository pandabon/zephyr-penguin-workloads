# Defaults for every Saturn benchmark (per-benchmark additions: conf/<bench>.conf).
CONFIG_PRINTK=y
# The benchmarks keep big arrays and VLA on the stack (vec-sgemm overflows the
# 4 KB default and then hangs silently). 128 KB is plenty for all of them.
CONFIG_MAIN_STACK_SIZE=131072
# Saturn's own Makefile builds with -O2; Zephyr's default is -Os.
CONFIG_SPEED_OPTIMIZATIONS=y
