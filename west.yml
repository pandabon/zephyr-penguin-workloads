# SPDX-License-Identifier: Apache-2.0
# West manifest of this application repo (zephyr-penguin-workloads). It pulls in the Penguin board
# repo, zephyr-penguin, and through that repo's own west.yml the pinned Zephyr fork (west, not git
# submodules: nothing is vendored).
#   mkdir ws && cd ws && git clone <this repo> zephyr-penguin-workloads
#   west init -l zephyr-penguin-workloads && west update
#
# Inside the maintainers' workspace (~/toolsC/bringup) this file is NOT used: that workspace already
# has the board repo and Zephyr, and these apps simply build against them.
manifest:
  projects:
    - name: penguin               # the board repo's Zephyr module name (zephyr/module.yml)
      url: git@github.com:pandabon/zephyr-penguin.git
      path: zephyr-penguin
      # Pinned to the board repo after its reorg (moved samples and tests, front ends removed,
      # module renamed penguin, repo renamed zephyr-penguin). This is a commit of the board repo's
      # development line, which is not on GitHub (GitHub has only the public main): to build outside
      # the maintainers' workspace, replace it with the matching public main commit.
      revision: 67c68a99a2fec4986a32da2e43484258aed1579d
      import: true                # also fetches Zephyr at the SHA the board repo pins

    # Opt-in group `executorch` (PW-2): the sources executorch/mnist builds. Off by default, so a
    # plain `west update` fetches neither. Turn it on once per workspace, persistently:
    #   west config manifest.group-filter -- +executorch && west update
    # (the one-off `west update --group-filter +executorch` clones them, but west then still counts
    # them as inactive.) EXECUTORCH_DIR / XNNPACK_DIR override these checkouts.
    - name: executorch
      url: https://github.com/pandabon/executorch
      revision: c19e05968e8da0b3f49c5bc1f7e2debcaad27bac   # branch zephyr-1.0.1-bf16 (ExecuTorch 1.0.1 + bf16/RVV)
      path: modules/lib/executorch   # the folder must be named executorch (<executorch/...> includes)
      submodules: true            # flatcc, flatbuffers, XNNPACK's helpers (FP16, FXdiv, ...)
      groups: [executorch]
    - name: xnnpack
      url: https://github.com/pandabon/XNNPACK
      # branch torch-1.0.0-bump-bf16 (RVV, Zvfbfmin, Zvfbfa kernels; pushed 2026-11-06).
      revision: c0d34218458221e5d5a2c045463a215736ac6c06
      path: modules/lib/XNNPACK
      groups: [executorch]
  group-filter: [-executorch]
  self:
    path: zephyr-penguin-workloads
