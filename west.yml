# SPDX-License-Identifier: Apache-2.0
# West manifest of this application repo. It pulls in the Chipyard BSP, and through the BSP's own
# west.yml the pinned Zephyr fork (west, not git submodules: nothing is vendored).
#   mkdir ws && cd ws && git clone <this repo> penguin-workloads
#   west init -l penguin-workloads && west update
#
# Inside the maintainers' workspace (~/toolsC/bringup) this file is NOT used: that workspace already
# has the BSP and Zephyr, and these apps simply build against them.
manifest:
  projects:
    - name: chipyard-bsp          # the name mk/user.mk and the scripts look for
      url: git@github.com:pandabon/zephyr-chipyard-bsp.git
      path: zephyr-chipyard-bsp
      # Pinned to the post-restructure BSP (README layout, mk/user.mk, spike_runner.py). That commit
      # is only local until the BSP restructure is pushed: then replace this SHA with the pushed
      # one (the suite runner also needs the BSP change "run_tests: --root", branch dev/workloads-support).
      revision: d1cff222b53cbed0253468d706d219c9762d3a68
      import: true                # also fetches Zephyr at the SHA the BSP pins
  self:
    path: penguin-workloads
