# Penguin has ONE hart, so no CONFIG_SMP and no CONFIG_MP_MAX_NUM_CPUS (the original asked for 4 CPUs, which
# cannot start here). SCHED_CPU_MASK stays only so that k_thread_cpu_pin() in main.c still compiles; with
# one CPU it is a harmless "run on CPU 0" call. SCHED_CPU_MASK_PIN_ONLY needs SMP and is dropped.
CONFIG_THREAD_STACK_INFO=y
CONFIG_SCHED_CPU_MASK=y
CONFIG_SCHED_DUMB=y

CONFIG_FPU=y
CONFIG_FLOAT_HARD=y
CONFIG_FPU_SHARING=y
CONFIG_RISCV_ISA_EXT_V=y
CONFIG_RISCV_VECTOR_MAX_LEN=256
